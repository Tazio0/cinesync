name: Smoke tests

on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ github.event.inputs.target_url || secrets.VERCEL_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run two-peer smoke test
        env:
          TARGET_URL: ${{ env.TARGET_URL }}
        run: |
          echo "Target URL: $TARGET_URL"
          node --version
          npm --version
          node scripts/twopeers-test.mjs
